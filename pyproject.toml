[project]
name = "shopper-composite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "calleja", email = "lecn99@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mysql-connector-python>=26.7.0",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
shopper-ingest = "shopper_composite.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
